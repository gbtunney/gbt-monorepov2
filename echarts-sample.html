<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Mobile Annotation Timeline</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 8px;
      color: #e8eef8;
      background:
        radial-gradient(circle at top, #162334 0, #08111b 45%, #04090f 100%);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .panel {
      width: 100%;
      margin: 0 auto;
      overflow: hidden;
      border: 1px solid #223347;
      border-radius: 16px;
      background: rgba(6, 14, 24, 0.96);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.26);
    }

    .header {
      padding: 10px 12px 8px;
      border-bottom: 1px solid #1c2a3a;
    }

    .title {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    .subtitle {
      margin-top: 2px;
      color: #8ea3ba;
      font-size: 12px;
    }

    .controls {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    button {
      padding: 6px 10px;
      font-size: 12px;
      color: #dce7f5;
      cursor: pointer;
      border: 1px solid #31445c;
      border-radius: 10px;
      background: #122031;
    }

    button:hover {
      border-color: #6f92ff;
      background: #18293d;
    }

    #chart {
      width: 100%;
      height: 470px;
    }

    .help {
      display: grid;
      gap: 4px 10px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      padding: 8px 12px 12px;
      color: #7f93aa;
      border-top: 1px solid #1c2a3a;
      font-size: 11px;
    }

    @media (min-width: 900px) {
      .panel {
        max-width: 1080px;
      }

      .header {
        padding: 12px 14px 10px;
      }

      #chart {
        height: 520px;
      }
    }
  </style>
</head>
<body>
  <section class="panel">
    <header class="header">
      <h1 class="title">Label Annotation Timeline</h1>
      <div class="subtitle">Compact mobile view · 30 extra labels · names hidden by default</div>

      <div class="controls">
        <button id="zoomIn" type="button">+</button>
        <button id="zoomOut" type="button">−</button>
        <button id="reset" type="button">Fit</button>
        <button id="toggleNames" type="button">Names: Off</button>
      </div>
    </header>

    <div id="chart"></div>

    <footer class="help">
      <span>Wheel/pinch: zoom time</span>
      <span>Drag plot: pan time</span>
      <span>Bottom slider: resize time window</span>
      <span>Right slider: scroll label rows</span>
    </footer>
  </section>

  <script>
    // ---------------------------
    // Base sample labels from your payload
    // ---------------------------
    const sampleAnnotations = {
      annotation_results: [
        {
          shot_label_annotations: [
            {
              entity: { description: "person" },
              segments: [
                {
                  confidence: 0.88,
                  segment: {
                    start_time_offset: { seconds: 1 },
                    end_time_offset: { seconds: 9 }
                  }
                }
              ]
            },
            {
              category_entities: [{ description: "outdoor" }],
              entity: { description: "walking" },
              segments: [
                {
                  confidence: 0.72,
                  segment: {
                    start_time_offset: { seconds: 3, nanos: 500000000 },
                    end_time_offset: { seconds: 7 }
                  }
                }
              ]
            },
            {
              entity: { description: "sky" },
              segments: [
                {
                  confidence: 0.34,
                  segment: {
                    start_time_offset: { seconds: 0 },
                    end_time_offset: { seconds: 10 }
                  }
                }
              ]
            }
          ]
        }
      ]
    };

    // ---------------------------
    // Settings
    // ---------------------------
    const DURATION = 10;
    const EXTRA_RANDOM_LABELS = 30;
    const INITIAL_VISIBLE_ROWS = 9;
    let showLeftLabels = false;

    // ---------------------------
    // Seeded random for stable demo output
    // ---------------------------
    function createRandom(seed = 42) {
      let state = seed >>> 0;
      return function rand() {
        state = (1664525 * state + 1013904223) >>> 0;
        return state / 4294967296;
      };
    }
    const rand = createRandom(42);

    // ---------------------------
    // Helpers
    // ---------------------------
    function toSeconds(offset = {}) {
      return Number(offset.seconds || 0) + Number(offset.nanos || 0) / 1e9;
    }

    function formatTime(value) {
      const total = Number(value || 0);
      const minutes = Math.floor(total / 60);
      const seconds = Math.floor(total % 60);
      return `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
    }

    function makeOffset(secondsFloat) {
      const secs = Math.floor(secondsFloat);
      const nanos = Math.round((secondsFloat - secs) * 1e9);
      return { seconds: secs, nanos };
    }

    function makeSyntheticShotLabels(count, duration) {
      const pool = [
        "car", "road", "bridge", "water", "tree", "building", "crowd", "bicycle",
        "bus", "train", "sign", "store", "food", "bakery", "dog", "cat",
        "table", "chair", "window", "street", "river", "mountain", "cloud",
        "sunset", "boat", "tower", "traffic", "phone", "laptop", "cup",
        "book", "grass", "flower", "airport", "kitchen", "beach", "bird",
        "statue", "market", "park"
      ];

      const items = [];
      for (let i = 0; i < count; i++) {
        const baseName = pool[i % pool.length];
        const label = `${baseName} ${String(i + 1).padStart(2, "0")}`;

        const segmentCount = rand() > 0.68 ? 2 : 1;
        const segments = [];

        for (let s = 0; s < segmentCount; s++) {
          const start = Number((rand() * (duration - 1.2)).toFixed(2));
          const len = Number((0.45 + rand() * 2.7).toFixed(2));
          const end = Math.min(duration, Number((start + len).toFixed(2)));

          segments.push({
            confidence: Number((0.35 + rand() * 0.63).toFixed(2)),
            segment: {
              start_time_offset: makeOffset(start),
              end_time_offset: makeOffset(end)
            }
          });
        }

        items.push({
          entity: { description: label },
          category_entities: rand() > 0.7 ? [{ description: "synthetic" }] : [],
          segments
        });
      }

      return items;
    }

    // ---------------------------
    // Build data
    // ---------------------------
    const baseLabels =
      sampleAnnotations.annotation_results?.[0]?.shot_label_annotations ?? [];

    const allAnnotations = [
      ...baseLabels,
      ...makeSyntheticShotLabels(EXTRA_RANDOM_LABELS, DURATION)
    ];

    const labels = allAnnotations.map((annotation, index) =>
      annotation.entity?.description || `Label ${index + 1}`
    );

    const palette = [
      ["#9a4de0", "#c979ff"],
      ["#18a3b1", "#45d5e1"],
      ["#e06b1f", "#ff9a52"],
      ["#2e80ea", "#6cb1ff"],
      ["#4ca957", "#7ddd89"],
      ["#d6a309", "#ffd24c"],
      ["#d64a79", "#ff82aa"],
      ["#5f73e6", "#97a5ff"]
    ];

    const seriesData = allAnnotations.flatMap((annotation, rowIndex) => {
      const label = annotation.entity?.description || `Label ${rowIndex + 1}`;
      const category =
        annotation.category_entities?.map((x) => x.description).filter(Boolean).join(", ") || "";

      return (annotation.segments || []).map((segmentItem) => ({
        value: [
          rowIndex,
          toSeconds(segmentItem.segment?.start_time_offset),
          toSeconds(segmentItem.segment?.end_time_offset),
          Number(segmentItem.confidence || 0)
        ],
        label,
        category,
        itemStyle: {
          color: palette[rowIndex % palette.length][0],
          borderColor: palette[rowIndex % palette.length][1]
        }
      }));
    });

    // ---------------------------
    // Chart
    // ---------------------------
    const chartElement = document.getElementById("chart");
    const chart = echarts.init(chartElement);

    function renderRange(params, api) {
      const rowIndex = api.value(0);
      const start = api.coord([api.value(1), rowIndex]);
      const end = api.coord([api.value(2), rowIndex]);

      const rowHeight = api.size([0, 1])[1];
      const barHeight = Math.min(16, rowHeight * 0.58);

      const rect = echarts.graphic.clipRectByRect(
        {
          x: start[0],
          y: start[1] - barHeight / 2,
          width: Math.max(end[0] - start[0], 2),
          height: barHeight
        },
        {
          x: params.coordSys.x,
          y: params.coordSys.y,
          width: params.coordSys.width,
          height: params.coordSys.height
        }
      );

      if (!rect) return null;

      const item = seriesData[params.dataIndex];
      const children = [
        {
          type: "rect",
          shape: { ...rect, r: 4 },
          style: api.style({
            lineWidth: 1
          })
        }
      ];

      if (rect.width > 52) {
        children.push({
          type: "text",
          style: {
            x: rect.x + rect.width / 2,
            y: rect.y + rect.height / 2,
            text: item.label,
            fill: "#ffffff",
            font: "600 10px sans-serif",
            align: "center",
            verticalAlign: "middle",
            overflow: "truncate",
            width: rect.width - 10
          },
          silent: true
        });
      }

      return { type: "group", children };
    }

    function buildOption() {
      return {
        backgroundColor: "transparent",
        animationDuration: 250,

        grid: {
          top: 34,
          left: showLeftLabels ? 96 : 10,
          right: 26,
          bottom: 76,
          containLabel: false
        },

        tooltip: {
          trigger: "item",
          borderWidth: 1,
          borderColor: "#34465d",
          backgroundColor: "rgba(9, 16, 26, 0.97)",
          textStyle: { color: "#e8f0fa", fontSize: 11 },
          formatter(params) {
            const item = seriesData[params.dataIndex];
            const [row, start, end, confidence] = item.value;

            return [
              `<strong>${item.label}</strong>`,
              item.category ? `Category: ${item.category}` : "",
              `Start: ${formatTime(start)}`,
              `End: ${formatTime(end)}`,
              `Duration: ${(end - start).toFixed(2)}s`,
              `Confidence: ${(confidence * 100).toFixed(0)}%`
            ].filter(Boolean).join("<br>");
          }
        },

        xAxis: {
          type: "value",
          min: 0,
          max: DURATION,
          position: "top",
          axisLine: { lineStyle: { color: "#425568" } },
          axisTick: { lineStyle: { color: "#425568" } },
          axisLabel: {
            color: "#9fb2c8",
            fontSize: 10,
            margin: 8,
            formatter: formatTime
          },
          splitNumber: 6,
          splitLine: {
            lineStyle: {
              color: "rgba(120, 145, 170, 0.14)"
            }
          }
        },

        yAxis: {
          type: "category",
          inverse: true,
          data: labels,
          axisLine: { show: false },
          axisTick: { show: false },
          axisLabel: {
            show: showLeftLabels,
            color: "#dbe7f4",
            fontSize: 10,
            margin: 10,
            width: 78,
            overflow: "truncate"
          },
          splitLine: {
            show: true,
            lineStyle: {
              color: "rgba(120, 145, 170, 0.10)"
            }
          },
          splitArea: {
            show: true,
            areaStyle: {
              color: ["rgba(255,255,255,0.014)", "rgba(255,255,255,0.03)"]
            }
          }
        },

        dataZoom: [
          {
            type: "inside",
            xAxisIndex: 0,
            filterMode: "none",
            zoomOnMouseWheel: true,
            moveOnMouseMove: true,
            moveOnMouseWheel: false,
            preventDefaultMouseMove: true,
            startValue: 0,
            endValue: DURATION
          },
          {
            type: "slider",
            xAxisIndex: 0,
            filterMode: "none",
            height: 34,
            bottom: 16,
            left: showLeftLabels ? 96 : 10,
            right: 26,
            startValue: 0,
            endValue: DURATION * 0.45,
            brushSelect: false,
            showDetail: false,
            backgroundColor: "#0c1624",
            borderColor: "#2e4257",
            fillerColor: "rgba(88, 118, 174, 0.28)",
            handleSize: 18,
            handleStyle: {
              color: "#d7e5f7",
              borderColor: "#6d84a1"
            },
            moveHandleStyle: {
              color: "#6d84a1"
            },
            dataBackground: {
              lineStyle: { color: "#51667f" },
              areaStyle: { color: "rgba(92, 119, 151, 0.15)" }
            },
            selectedDataBackground: {
              lineStyle: { color: "#7db0ff" },
              areaStyle: { color: "rgba(74, 131, 224, 0.28)" }
            }
          },
          {
            type: "inside",
            yAxisIndex: 0,
            zoomOnMouseWheel: false,
            moveOnMouseWheel: true,
            moveOnMouseMove: true,
            startValue: 0,
            endValue: Math.min(INITIAL_VISIBLE_ROWS - 1, labels.length - 1)
          },
          {
            type: "slider",
            yAxisIndex: 0,
            orient: "vertical",
            right: 6,
            top: 34,
            bottom: 76,
            width: 12,
            showDetail: false,
            brushSelect: false,
            startValue: 0,
            endValue: Math.min(INITIAL_VISIBLE_ROWS - 1, labels.length - 1),
            backgroundColor: "#0c1624",
            borderColor: "#2e4257",
            fillerColor: "rgba(88, 118, 174, 0.28)",
            handleSize: 12,
            handleStyle: {
              color: "#d7e5f7",
              borderColor: "#6d84a1"
            },
            moveHandleStyle: {
              color: "#6d84a1"
            }
          }
        ],

        series: [
          {
            name: "Labels",
            type: "custom",
            renderItem: renderRange,
            encode: {
              x: [1, 2],
              y: 0
            },
            data: seriesData,
            clip: true
          }
        ]
      };
    }

    chart.setOption(buildOption());

    // ---------------------------
    // Controls
    // ---------------------------
    function getTimeWindow() {
      const zoom = chart.getOption().dataZoom[0];
      return {
        start: Number(zoom.startValue ?? 0),
        end: Number(zoom.endValue ?? DURATION)
      };
    }

    function setTimeWindow(start, end) {
      const minWidth = 0.35;
      const width = Math.max(end - start, minWidth);

      let nextStart = Math.max(0, start);
      let nextEnd = nextStart + width;

      if (nextEnd > DURATION) {
        nextEnd = DURATION;
        nextStart = Math.max(0, DURATION - width);
      }

      chart.dispatchAction({
        type: "dataZoom",
        dataZoomIndex: 0,
        startValue: nextStart,
        endValue: nextEnd
      });

      chart.dispatchAction({
        type: "dataZoom",
        dataZoomIndex: 1,
        startValue: nextStart,
        endValue: nextEnd
      });
    }

    function zoomBy(factor) {
      const current = getTimeWindow();
      const center = (current.start + current.end) / 2;
      const half = ((current.end - current.start) * factor) / 2;
      setTimeWindow(center - half, center + half);
    }

    document.getElementById("zoomIn").addEventListener("click", () => zoomBy(0.72));
    document.getElementById("zoomOut").addEventListener("click", () => zoomBy(1.35));
    document.getElementById("reset").addEventListener("click", () => {
      setTimeWindow(0, DURATION * 0.45);
      chart.dispatchAction({
        type: "dataZoom",
        dataZoomIndex: 2,
        startValue: 0,
        endValue: Math.min(INITIAL_VISIBLE_ROWS - 1, labels.length - 1)
      });
      chart.dispatchAction({
        type: "dataZoom",
        dataZoomIndex: 3,
        startValue: 0,
        endValue: Math.min(INITIAL_VISIBLE_ROWS - 1, labels.length - 1)
      });
    });

    document.getElementById("toggleNames").addEventListener("click", (e) => {
      showLeftLabels = !showLeftLabels;
      e.currentTarget.textContent = `Names: ${showLeftLabels ? "On" : "Off"}`;
      chart.setOption(buildOption(), true);
    });

    chart.getZr().on("dblclick", () => {
      setTimeWindow(0, DURATION * 0.45);
    });

    new ResizeObserver(() => chart.resize()).observe(chartElement);
  </script>
</body>
</html>
